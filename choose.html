<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>JIS&amp;T 結果選択</title>
    <link rel="stylesheet" href="./css/result.css" />
  </head>
  <body>
    <main class="card" role="main">
      <h1 class="title">結果を選択</h1>
      <p class="description">
        押した時点でアプリへ直接リダイレクトします（Web 結果画面は表示しません）。
      </p>
      <div class="actions">
        <a id="success-btn" class="btn btn--primary" href="#">Success（成功）</a>
        <a id="failure-btn" class="btn btn--danger" href="#">Failure（失敗）</a>
      </div>
    </main>
    <script src="./js/deeplink.js"></script>
    <script>
      document.getElementById("success-btn").href = MizuhoDeepLink.urlFor("success");
      document.getElementById("failure-btn").href = MizuhoDeepLink.urlFor("failure");
      document.getElementById("success-btn").addEventListener("click", function (event) {
        event.preventDefault();
        MizuhoDeepLink.redirect("success");
      });
      document.getElementById("failure-btn").addEventListener("click", function (event) {
        event.preventDefault();
        MizuhoDeepLink.redirect("failure");
      });
    </script>
  </body>
</html>
